# Le serveur temps réel du Quiz'Animanga (buzzer, rooms, Liens d'Ayanokoji, Pensées d'Anya).
# Sur Render : New > Blueprint, puis choisir ce dépôt. Le site, lui, reste sur Vercel.
services:
  - type: web
    name: quiz-animanga-temps-reel
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm run server
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "24"
      # Le mot de passe de la régie : Render le demande à la création, il n'est jamais écrit dans le dépôt
      - key: HOST_PASSWORD
        sync: false
